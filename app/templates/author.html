{% extends 'base.html' %}
{% block title %}作者 - Pixiv Archive{% endblock %}

{% block content %}

<div class="content">
    <header class="content-topbar">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索标题 / 作者 / 标签 / Pixiv ID..."
                   onkeydown="if(event.key==='Enter'){window.location.href='/?q='+encodeURIComponent(this.value)}">
            <button onclick="window.location.href='/?q='+encodeURIComponent(document.getElementById('searchInput').value)">搜索</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="authorInfo" class="author-header" style="display:none;"></div>
            <div class="gallery" id="gallery"></div>
            <div id="loading" class="loading" style="display:none;">加载中...</div>
            <div id="empty" class="empty-state" style="display:none;">该作者没有作品。</div>
            <div class="pagination" id="pagination" style="display:none;"></div>
        </div>
    </main>
</div>

<script>
const authorId = {{ author_id }};
let currentPage = 1;

async function load() {
    document.getElementById('loading').style.display = 'block';

    // 原先这里还并发请求了一次 /api/artworks（结果从未使用），已去掉
    const authors = await fetchJson('/api/authors');
    if (!authors) return;
    const author = authors.find(a => a.id == authorId);
    if (author) {
        document.getElementById('authorInfo').style.display = 'block';
        document.getElementById('authorInfo').innerHTML = `
            <h2>${escapeHtml(author.name)}</h2>
            <div class="author-meta">Pixiv ID：${author.pixiv_user_id} | 作品数：${author.artwork_count}</div>`;
        window._authorName = author.name;
        loadAuthorArtworks();
    } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').innerHTML = '作者未找到';
    }
}

async function loadAuthorArtworks(page = 1) {
    currentPage = page;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('gallery').innerHTML = '';

    const data = await fetchJson(`/api/artworks?page=${page}&author=${encodeURIComponent(window._authorName)}&r18=${r18Param()}&ai=${aiParam()}`);
    if (!data) return;
    document.getElementById('loading').style.display = 'none';

    if (data.artworks.length === 0) {
        document.getElementById('empty').style.display = 'block';
        return;
    }

    let html = '';
    data.artworks.forEach(a => {
        const title = a.title || `Pixiv ID: ${a.pixiv_id}`;
        const thumb = a.thumb_path ? `/thumbnails/${a.pixiv_id}.jpg` : '';
        html += `
        <div class="card">
            <a href="/artwork/${a.id}">
                ${thumb ? `<img class="thumb" src="${thumb}" alt="${escapeAttr(title)}" loading="lazy">`
                        : `<div class="thumb">无缩略图</div>`}
                <div class="info">
                    <div class="title">${escapeHtml(title)}</div>
                    <div class="meta">
                        <span>PID: ${a.pixiv_id}</span>
                        ${a.page_count > 1 ? `<span class="badge multi">${a.page_count}P</span>` : ''}
                    </div>
                </div>
            </a>
        </div>`;
    });
    document.getElementById('gallery').innerHTML = html;

    const pagDiv = document.getElementById('pagination');
    pagDiv.style.display = 'flex';
    pagDiv.innerHTML = `
        <button ${data.page <= 1 ? 'disabled' : ''} onclick="loadAuthorArtworks(${data.page - 1})">上一页</button>
        <span class="page-info">第 ${data.page} / ${data.total_pages} 页</span>
        <button ${data.page >= data.total_pages ? 'disabled' : ''} onclick="loadAuthorArtworks(${data.page + 1})">下一页</button>`;
}

load();
</script>
{% endblock %}
