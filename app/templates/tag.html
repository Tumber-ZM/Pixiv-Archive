{% extends 'base.html' %}
{% block title %}标签 - Pixiv Archive{% endblock %}

{% block content %}

<div class="content">
    <header class="content-topbar">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索标题 / 作者 / 标签 / Pixiv ID..."
                   onkeydown="if(event.key==='Enter'){window.location.href='/?q='+encodeURIComponent(this.value)}">
            <button onclick="window.location.href='/?q='+encodeURIComponent(document.getElementById('searchInput').value)">搜索</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="tagInfo" class="tag-header" style="display:none;"></div>
            <div class="gallery" id="gallery"></div>
            <div id="loading" class="loading" style="display:none;">加载中...</div>
            <div id="empty" class="empty-state" style="display:none;">该标签下没有作品。</div>
            <div class="pagination" id="pagination" style="display:none;"></div>
        </div>
    </main>
</div>

<script>
// tojson 会转义 < > & ' 与反斜杠/换行，避免标签名里的特殊字符打断脚本字面量。
// （Jinja 的 HTML 转义在 script 标签内不解码实体：用双引号直接包住变量，既可能
//   给出错误的值，也无法处理反斜杠导致的语法错误。）
const tagName = decodeURIComponent({{ tag_name | tojson }});
let currentPage = 1;

async function load() {
    document.getElementById('tagInfo').style.display = 'block';
    document.getElementById('tagInfo').innerHTML = `<h2>#${escapeHtml(tagName)}</h2>`;
    await loadTagArtworks();
}

async function loadTagArtworks(page = 1) {
    currentPage = page;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('gallery').innerHTML = '';

    const data = await fetchJson(`/api/artworks?page=${page}&tag=${encodeURIComponent(tagName)}&r18=${r18Param()}&ai=${aiParam()}`);
    if (!data) return;
    document.getElementById('loading').style.display = 'none';

    if (data.artworks.length === 0) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('tagInfo').innerHTML += `<div class="tag-meta">作品：0</div>`;
        return;
    }

    document.getElementById('tagInfo').innerHTML += `<div class="tag-meta">作品：${data.total}</div>`;

    let html = '';
    data.artworks.forEach(a => {
        const title = a.title || `Pixiv ID: ${a.pixiv_id}`;
        const thumb = a.thumb_path ? `/thumbnails/${a.pixiv_id}.jpg` : '';
        html += `
        <div class="card">
            <a href="/artwork/${a.id}">
                ${thumb ? `<img class="thumb" src="${thumb}" alt="${escapeAttr(title)}" loading="lazy">`
                        : `<div class="thumb">无缩略图</div>`}
                <div class="info">
                    <div class="title">${escapeHtml(title)}</div>
                    <div class="author">${escapeHtml(a.author_name)}</div>
                    <div class="meta">
                        <span>PID: ${a.pixiv_id}</span>
                        ${a.page_count > 1 ? `<span class="badge multi">${a.page_count}P</span>` : ''}
                    </div>
                </div>
            </a>
        </div>`;
    });
    document.getElementById('gallery').innerHTML = html;

    const pagDiv = document.getElementById('pagination');
    pagDiv.style.display = 'flex';
    pagDiv.innerHTML = `
        <button ${data.page <= 1 ? 'disabled' : ''} onclick="loadTagArtworks(${data.page - 1})">上一页</button>
        <span class="page-info">第 ${data.page} / ${data.total_pages} 页</span>
        <button ${data.page >= data.total_pages ? 'disabled' : ''} onclick="loadTagArtworks(${data.page + 1})">下一页</button>`;
}

load();
</script>
{% endblock %}
